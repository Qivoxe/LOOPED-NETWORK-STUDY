experiment:
  name: looped_network_diagnostics
  description: Controlled optimization experiments
  seeds: [42, 123, 2026]

model:
  input_dim: 2
  hidden_dim: 64
  output_dim: 2

recurrent_depths:
  - 1
  - 2
  - 4
  - 8

optimizers:
  - sgd
  - adamw

training:
  epochs: 15
  batch_size: 64

optimizer_settings:
  sgd:
    learning_rate: 0.01
    momentum: 0.9
    weight_decay: 0.0

  adamw:
    learning_rate: 0.001
    weight_decay: 0.01

dataset:
  name: two_moons
  samples: 2000
  noise: 0.2
  validation_fraction: 0.2

output:
  directory: results/metrics
experiment:
  name: learning_rate_sensitivity
  seeds: [42, 123, 2026]

model:
  input_dim: 2
  hidden_dim: 64
  output_dim: 2

recurrent_depths: [1, 2, 4, 8]

optimizers: [sgd, adamw]

learning_rates:
  sgd: [0.001, 0.003, 0.01, 0.03]
  adamw: [0.0001, 0.0003, 0.001, 0.003]

optimizer_settings:
  sgd:
    momentum: 0.9
    weight_decay: 0.0

  adamw:
    weight_decay: 0.01

training:
  epochs: 15
  batch_size: 64

dataset:
  name: two_moons
  samples: 2000
  noise: 0.2
  validation_fraction: 0.2

output:
  directory: results/learning_rate_sensitivity